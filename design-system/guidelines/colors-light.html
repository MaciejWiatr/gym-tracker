<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces (dark)" subtitle="data-theme=dark: over photography and video" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);font-size:12px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}[data-theme=dark] .n{color:var(--text-1)}</style></head><body><div data-theme="dark" style="background:var(--surface-app);padding:14px;border-radius:14px;color:var(--text-1)"><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="n">surface-app</div><div class="v">ink-50</div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="n">surface-card</div><div class="v">white</div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">surface-raised</div><div class="v">ink-100</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">surface-sunken</div><div class="v">ink-200</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="n">surface-inverse</div><div class="v">ink-950</div></div></div></div></body></html>
