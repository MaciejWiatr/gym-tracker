<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);font-size:12px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="n">surface-app</div><div class="v">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="n">surface-card</div><div class="v">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">surface-raised</div><div class="v">#F5F4F5</div></div><div class="sw"><div class="chip" style="background:var(--surface-field)"></div><div class="n">surface-field</div><div class="v">#F1F0F1</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">surface-sunken</div><div class="v">#EAE8EA</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="n">surface-inverse</div><div class="v">ink-900</div></div></div></body></html>
