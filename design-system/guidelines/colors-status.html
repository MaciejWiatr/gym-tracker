<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);font-size:12px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--status-success);height:44px"></div><div class="n">success</div><div class="v">#3DDC84</div></div><div class="sw"><div class="chip" style="background:var(--status-warning);height:44px"></div><div class="n">warning</div><div class="v">#FFB020</div></div><div class="sw"><div class="chip" style="background:var(--status-danger);height:44px"></div><div class="n">danger</div><div class="v">#FF3B4E</div></div><div class="sw"><div class="chip" style="background:var(--status-info);height:44px"></div><div class="n">info</div><div class="v">#4A90E2</div></div></div></body></html>
