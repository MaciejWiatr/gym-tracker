<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);font-size:12px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="align-items:flex-start;gap:28px"><div style="display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:600"><span style="color:var(--text-1)">text-1 · Primary</span><span style="color:var(--text-2)">text-2 · Secondary</span><span style="color:var(--text-3)">text-3 · Tertiary</span><span style="color:var(--text-accent)">text-accent · Rose 700</span></div><div style="display:flex;flex-direction:column;gap:10px;flex:1"><div style="height:30px;border:1px solid var(--border-subtle);border-radius:10px;padding:6px 10px" class="v">border-subtle .08</div><div style="height:30px;border:1px solid var(--border-strong);border-radius:10px;padding:6px 10px" class="v">border-strong .18</div><div style="height:30px;border:1.5px dashed var(--border-dashed);border-radius:10px;padding:6px 10px" class="v">border-dashed — empty / add slots</div></div></div></body></html>
