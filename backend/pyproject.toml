[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]>=0.121.0",
  "jinja2>=3.1.4",
  "psycopg-pool>=3.3.3",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.2.1",
  "uvicorn>=0.34.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
